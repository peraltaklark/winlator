name: Build Winlator APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Extra safety: make sure submodules are fully initialised
      - name: Update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build meson \
            mingw-w64 \
            libglib2.0-dev \
            libgcrypt20-dev \
            libpixman-1-dev \
            flex bison \
            gettext \
            pkg-config \
            automake autoconf libtool \
            python3-pip \
            unzip zip

      # Locate gradlew (file or symlink) anywhere in repo
      - name: Locate gradlew
        id: locate
        run: |
          GRADLEW_PATH=$(find . -name gradlew \( -type f -o -type l \) | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found (searched for files and symlinks)"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "gradlew_path=$GRADLEW_PATH" >> $GITHUB_OUTPUT
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found gradlew at: $GRADLEW_PATH"
          echo "Project directory: $PROJECT_DIR"

      # Run dependency download script if it exists (from project dir)
      - name: Download prebuilt dependencies (if any)
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f ./download_dependencies.sh ]; then
            chmod +x ./download_dependencies.sh
            ./download_dependencies.sh
          elif [ -f ./download.sh ]; then
            chmod +x ./download.sh
            ./download.sh
          else
            echo "No dependency download script found. Skipping."
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/**/*.gradle*', steps.locate.outputs.project_dir), format('{0}/gradle/wrapper/gradle-wrapper.properties', steps.locate.outputs.project_dir)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
